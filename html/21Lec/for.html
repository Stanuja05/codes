<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <title>Html form and inputs</title>
</head>
<body>
    <label > Registration Form</label>

    <br><br>
    <fieldset>
        <legend> Personal Information</legend>
    
            <label> Full Name: </label>
            <input type ="text">

            <br><br>

            <input type = "password">

            <br><br>
            <label> Email:</label>
            <input type = "email">

            <br><br>
            <label> Age: </label>
            <input type="number" min ="7" max ="40">

            <br><br>
            <label> Date of Birth</label>
            <input type ="date">

            <br><br>
            <label> Gender</label>
            <input type="radio" name = "gender"> Male
            <input type = "radio" name = "gender"> Female 
            <input type= "radio" name ="gender"> Other
    </fieldset>
    
    <br><br>

            <input type="checkbox"> Drawing

            <br><br>
    </fieldset>
