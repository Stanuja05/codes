<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Obline Job Application Portal</h1>
    <p> Apply for your dream job!</p>
    <hr>

    <form>

        <!-----------------------  1.   -->
        <fieldset>
            <legend>1. Personal Information</legend>
            <lable> Full Name:</lable>      <input type = "text">

            <br><br>
            <label>Create Password:</label>  <input type="password"> 

            <br><br>
            <label>Email Address:</label>     <input type="email">

            <br><br>
            <label>Mobile Number:</label>      <input type="tel">

            <br><br>
            <label>Age: </label>              <input type="number"  min="15"  max="80">

            <br><br>
            <label>Date of Birth:</label>     <input type="date">

            <br><br>
            <label>Gender</label>            
            <input type="radio" name ="gender"> Male
            <input type="radio" name = "gender"> Female
            <input type="radio" name = "gender"> Other

            <br><br>
            <label> Current Address: </label> <br>
            <textarea placeholder="Enter your address"></textarea>

            <br><br>
            <label> Profile Photograph: </label>      <input type="file">

            <br><br>
            <label>Portfolio Website: </label>       <input type="text"  placeholder="https://example.com">   
            

            
            <!--------------    2   -->
            <fieldset>
                <legend>2.Educational Background</legend>
                <label>Heighest Qualification: </label>
                <select>
                    <option>B.E.</option>
                    <option> M.E.</option>

                </select>

            </fieldset>

        </fieldset>
    </form>
    
</body>
</html>
